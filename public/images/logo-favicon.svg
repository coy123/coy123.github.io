<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Bandi NCC">
  <defs>
    <linearGradient id="fField" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="fGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#d69e1c"/>
    </linearGradient>
    <path id="fShield" d="M7 12a5 5 0 0 1 5-5h40a5 5 0 0 1 5 5v25c0 14-11 21-25 24C18 58 7 51 7 37z"/>
    <clipPath id="fShieldClip"><use href="#fShield"/></clipPath>
  </defs>
  <use href="#fShield" fill="url(#fField)"/>
  <g clip-path="url(#fShieldClip)">
    <rect x="4" y="4" width="56" height="11" fill="#0f172a"/>
    <rect x="4" y="15" width="56" height="1.6" fill="url(#fGold)"/>
    <!-- car: solid, no sub-pixel glazing.
         Body spans 15->58.4 and wheels sit at 22.5/50.9, both centred on 36.7;
         the outer transform re-centres that on the shield's axis (x=32). -->
    <g transform="translate(32 36) scale(0.88) translate(-36.7 -34.75)">
      <g fill="url(#fGold)">
        <path d="M15 40v-4.5c0-2 1.4-3.4 3.6-3.8l8.4-1.4 5.6-4.6c1.2-1 2.6-1.4 4.2-1.4h6.6c1.8 0 3.2.5 4.4 1.6l4.6 4.4 3 .8c2 .6 3 1.8 3 3.8V40z"/>
        <circle cx="22.5" cy="40" r="5.2"/>
        <circle cx="50.9" cy="40" r="5.2"/>
      </g>
      <circle cx="22.5" cy="40" r="2" fill="#1d4ed8"/>
      <circle cx="50.9" cy="40" r="2" fill="#1d4ed8"/>
    </g>
  </g>
  <use href="#fShield" fill="none" stroke="url(#fGold)" stroke-width="3.5"/>
</svg>
