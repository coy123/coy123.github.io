<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 262" role="img" aria-label="Bandi NCC">
  <defs>
    <linearGradient id="aField" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="aGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#eab308"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="aGoldFlat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#d69e1c"/>
    </linearGradient>
    <path id="aShield" d="M44 64a12 12 0 0 1 12-12h88a12 12 0 0 1 12 12v92c0 42-26 68-56 82-30-14-56-40-56-82z"/>
    <clipPath id="aShieldClip"><use href="#aShield"/></clipPath>
    <path id="aRibbon" d="M24 226l10 9-10 9 76 8 76-8-10-9 10-9-76 8z"/>
    <clipPath id="aRibbonClip"><use href="#aRibbon"/></clipPath>
    <!-- laurel leaf, tip along +X -->
    <path id="aLeaf" d="M0 0q10-9 24 0-14 9-24 0z"/>
  </defs>

  <!-- laurel branches -->
  <g fill="url(#aGoldFlat)">
    <g id="aLaurel">
      <path d="M44 216C24 202 12 172 14 120" fill="none" stroke="#a3782a" stroke-width="4" stroke-linecap="round"/>
      <g>
        <use href="#aLeaf" transform="translate(37.2 210.2) rotate(222)"/>
        <use href="#aLeaf" transform="translate(29.2 200.3) rotate(218)"/>
        <use href="#aLeaf" transform="translate(22.8 187.6) rotate(213)"/>
        <use href="#aLeaf" transform="translate(17.9 172.2) rotate(208)"/>
        <use href="#aLeaf" transform="translate(14.9 153.7) rotate(202)"/>
        <use href="#aLeaf" transform="translate(13.8 135.0) rotate(196)"/>
      </g>
      <g>
        <use href="#aLeaf" transform="translate(33.2 205.3) rotate(318) scale(0.85)"/>
        <use href="#aLeaf" transform="translate(26.0 194.0) rotate(314) scale(0.85)"/>
        <use href="#aLeaf" transform="translate(20.3 180.0) rotate(310) scale(0.85)"/>
        <use href="#aLeaf" transform="translate(16.4 163.0) rotate(306) scale(0.85)"/>
        <use href="#aLeaf" transform="translate(14.3 144.0) rotate(300) scale(0.85)"/>
      </g>
    </g>
    <use href="#aLaurel" transform="translate(200 0) scale(-1 1)"/>
  </g>

  <!-- tricolour ribbon, tied behind the shield point -->
  <g clip-path="url(#aRibbonClip)">
    <rect x="20" y="218" width="58" height="40" fill="#15803d"/>
    <rect x="78" y="218" width="44" height="40" fill="#e5e7eb"/>
    <rect x="122" y="218" width="58" height="40" fill="#b91c1c"/>
  </g>
  <use href="#aRibbon" fill="none" stroke="#0f172a" stroke-opacity="0.35" stroke-width="2"/>

  <!-- corona turrita -->
  <g>
    <path fill="url(#aGold)" d="M46 20h16v12h7V20h16v12h7V20h16v12h7V20h16v12h7V20h16v32H46z"/>
    <path d="M50 42h104" stroke="#7c4a08" stroke-opacity="0.4" stroke-width="2.5" fill="none"/>
    <g fill="#7c4a08" fill-opacity="0.45">
      <circle cx="70" cy="47" r="2.4"/><circle cx="100" cy="47" r="2.4"/><circle cx="130" cy="47" r="2.4"/>
    </g>
  </g>

  <!-- shield -->
  <use href="#aShield" fill="url(#aField)"/>
  <g clip-path="url(#aShieldClip)">
    <!-- chief -->
    <rect x="40" y="48" width="120" height="40" fill="#0f172a"/>
    <rect x="40" y="86" width="120" height="4" fill="url(#aGoldFlat)"/>
    <g fill="url(#aGoldFlat)">
      <path d="M76 58l2.7 8.2h8.6l-7 5.1 2.7 8.2-7-5.1-7 5.1 2.7-8.2-7-5.1h8.6z"/>
      <path d="M100 58l2.7 8.2h8.6l-7 5.1 2.7 8.2-7-5.1-7 5.1 2.7-8.2-7-5.1h8.6z"/>
      <path d="M124 58l2.7 8.2h8.6l-7 5.1 2.7 8.2-7-5.1-7 5.1 2.7-8.2-7-5.1h8.6z"/>
    </g>

    <!-- nome, in lettera d'oro -->
    <text x="100" y="120" text-anchor="middle" textLength="96" lengthAdjust="spacingAndGlyphs"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="16" font-weight="700" letter-spacing="1" fill="url(#aGoldFlat)">BANDI NCC</text>

    <!-- berlina, or in campo azzurro -->
    <g transform="translate(48 138) scale(0.8)">
      <path fill="url(#aGoldFlat)" d="M6 34v-8c0-4 3-7 8-8l20-2 14-9.5c3-2 6-2.5 10-2.5h24c5 0 9 1.5 12 4l12 9 10 2c5 1 8 4 8 8v7h-13a12.5 12.5 0 0 0-25 0H43a12.5 12.5 0 0 0-25 0z"/>
      <path fill="#1d4ed8" d="M41 16l10.5-8H65v8zM69 8h13c3.5 0 6 1 8 3l4.5 5H69z"/>
      <circle cx="30.5" cy="34.5" r="10.5" fill="url(#aGoldFlat)"/>
      <circle cx="30.5" cy="34.5" r="4.2" fill="#1d4ed8"/>
      <circle cx="98.5" cy="34.5" r="10.5" fill="url(#aGoldFlat)"/>
      <circle cx="98.5" cy="34.5" r="4.2" fill="#1d4ed8"/>
    </g>

    <!-- road in base -->
    <path d="M64 191q36 12 72 0" fill="none" stroke="url(#aGoldFlat)" stroke-width="7" stroke-linecap="round"/>
    <path d="M64 191q36 12 72 0" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 9"/>
  </g>
  <use href="#aShield" fill="none" stroke="url(#aGold)" stroke-width="6"/>
  <use href="#aShield" fill="none" stroke="#7c4a08" stroke-opacity="0.5" stroke-width="1.5"/>
</svg>
