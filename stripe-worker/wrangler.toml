name = "bandincc-stripe"
main = "src/index.ts"
compatibility_date = "2026-08-02"

# The Stripe SDK is a Node library. Without this it fails to bundle: it reaches
# for node:events / node:crypto even though the fetch http client is doing the
# actual work.
compatibility_flags = ["nodejs_compat"]

# The welcome email's templates are imported as strings. A Worker has no
# filesystem, so they are bundled in at build time; src/html.d.ts is the
# TypeScript half of the same statement. The globs are relative to this file,
# hence the ../ — the templates live at the repo root, not inside stripe-worker/.
#
# Listed one by one rather than as newsletter/*.html: a glob also uploads
# email_template.html, the DAILY CAMPAIGN's shell, which this Worker does not
# import and MailerLite renders instead. Only these two belong here.
[[rules]]
type = "Text"
globs = ["../newsletter/welcome_template.html", "../newsletter/email_table.html"]
fallthrough = true

# Free, and the only way to see why a webhook 500'd after the fact. `npm run
# tail` streams the same logs live while testing.
[observability]
enabled = true

# NOT a secret — it identifies the list, it does not grant access to it. Secrets
# (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, MAILERLITE_API_KEY) never appear in
# this file; see README.md.
#
# The top level is PRODUCTION: live Stripe keys, the real subscriber group.
[vars]
MAILERLITE_GROUP_ID = "193718534342181983"

# --- Welcome email (src/welcome.ts) -----------------------------------------
# No binding of its own. The welcome email is a MailerLite campaign aimed at a
# group of one (newsletter/mailerlite.mjs), so it reuses MAILERLITE_API_KEY —
# already a required secret — and the sender MailerLite has already verified.
# Nothing to configure, no second provider, no extra DNS.

# Linked in the welcome email's footer, beside the {$unsubscribe} link, as the
# calmer way to manage or end the subscription. Mirrors
# pages.abbonamento.manage.href in locales/it.json; the test environment below
# uses the test-mode portal.
STRIPE_PORTAL_URL = "https://billing.stripe.com/p/login/cNi14namu0kOaTH4fXfEk00?locale=it"

# One MailerLite account serves both Workers, so a staging welcome email is a
# real campaign in the real dashboard. "test" prefixes the subject and the
# campaign name with [test]; that prefix is the only way to tell them apart.
DEPLOY_MODE = "live"

# --- data/data.json for the welcome email (src/welcome.ts) ------------------
# Written by .github/workflows/deploy.yml after every successful production
# deploy, read by the welcome email to build its table of currently-embargoed
# bandi. It replaced a plain fetch of raw.githubusercontent.com, which only ever
# worked because the website repo was public.
#
# NOT a secret: it holds the same curated data.json the site is built from, and
# a namespace id is an identifier, not a credential.
#
# Create it once, then paste the id it prints here AND in [[env.test.kv_namespaces]]:
#   npx wrangler kv namespace create BANDI
#
# The same namespace serves both environments on purpose — the data is not
# mode-specific, and a test checkout should exercise the real held-back rows.
[[kv_namespaces]]
binding = "BANDI"
id = "5281f3d3d63c4e6db9f19f0a365896c8"

# ---------------------------------------------------------------------------
# Staging / test mode  —  `npm run deploy:test`, `npm run tail:test`
#
# Deploys a SECOND Worker, `bandincc-stripe-test.<subdomain>.workers.dev`, wired
# to the Stripe TEST account and a throwaway MailerLite group. The Netlify
# staging build points its Payment Links at test mode (see
# .github/workflows/netlify-deploy.yml), and those checkouts have to land
# somewhere that is not the live subscriber list.
#
# Two Workers rather than one that branches: a Stripe webhook endpoint is
# registered per mode and carries its own signing secret, and the secret is what
# decides whether an event is genuine. One Worker cannot hold two
# STRIPE_WEBHOOK_SECRETs, so test events would have to be accepted unverified —
# which is precisely the hole the signature check exists to close.
#
# Everything here is duplicated rather than inherited: named environments do NOT
# inherit `vars` from the top level. Leaving this block out would mean the test
# Worker deploying with no MAILERLITE_GROUP_ID at all — caught by the REQUIRED
# check in src/index.ts, but only at the first webhook.
#
# Secrets are per-environment too, and none of the four carry over:
#   printf '%s' "$KEY" | npx wrangler secret put STRIPE_SECRET_KEY --env test
# ...for STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, MAILERLITE_API_KEY and
# MAILERLITE_WEBHOOK_SECRET. The pipe matters for the MailerLite API key: it is
# ~987 chars and terminal paste into the hidden prompt truncates it silently.
#
# Note the MailerLite API key is the SAME key in both environments — MailerLite
# has no test mode. Only the group differs, so a staging checkout adds an
# address to the throwaway group and never to the one the campaigns go to.
# ---------------------------------------------------------------------------
[env.test]

[env.test.observability]
enabled = true

[env.test.vars]
# Not a secret, same as above. A wrong id here is silent: the grant succeeds and
# the address lands in the wrong group.
MAILERLITE_GROUP_ID = "194986214311330839"

# Repeated, not inherited — named environments take nothing from the top level.
# There is only one MailerLite account and it has no test mode, so a staging
# welcome email is a real campaign in the real dashboard: DEPLOY_MODE prefixes
# its subject and its campaign name with [test]. Only that and the portal link
# differ from production.
STRIPE_PORTAL_URL = "https://billing.stripe.com/p/login/test_cNi14namu0kOaTH4fXfEk00?locale=it"
DEPLOY_MODE = "test"

# Repeated, not inherited — as with vars above, a named environment takes no
# bindings from the top level. Same namespace id: one copy of the data, read by
# both Workers. Leaving this out is silent until the first test checkout, which
# then sends a welcome email with no table.
[[env.test.kv_namespaces]]
binding = "BANDI"
id = "5281f3d3d63c4e6db9f19f0a365896c8"
