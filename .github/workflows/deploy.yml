# The name is load-bearing and deliberately out of date. newsletter.yml chains
# off this workflow with `workflow_run: workflows: ["Deploy to GitHub Pages"]`,
# matching this exact string: rename it here alone and the newsletter silently
# stops. Nothing deploys to GitHub Pages any more — rename both in one commit,
# or neither.
name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  # A bando is subscriber-only for its first seven days, and the cutoff is
  # evaluated at build time (lib/data.ts — `output: 'export'` leaves no server
  # to evaluate it per request). So a rebuild is what actually releases a
  # bando: without this trigger, one detected eight days ago would stay hidden
  # until somebody happened to push.
  #
  # GitHub cron is UTC only: 05:00 UTC is 07:00 in Italy on summer time, 06:00
  # on winter time. It chains into newsletter.yml as usual, which finds no new
  # rows and simply advances the `newsletter-sent` tag.
  schedule:
    - cron: '0 5 * * *'


# Nothing here writes to the repo or needs an OIDC token: the Cloudflare jobs
# authenticate with CLOUDFLARE_API_TOKEN. `pages: write` and `id-token: write`
# went with the GitHub Pages jobs.
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
#
# PR test runs are kept out of the "pages" lane entirely: sharing it would let a
# newly queued PR run evict a queued merge deploy. Superseded PR runs are worth
# cancelling, production deploys are not.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.head_ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Builds the export and runs the Cypress suite against it. Every job below
  # needs this one, so a failing test stops the deploy.
  test:
    name: Build and test
    uses: ./.github/workflows/e2e.yml
    with:
      artifact-name: static-export-pages
      # The real domain, the real money. Stated rather than left to the default
      # so that anyone reading this file sees which Stripe account it ships.
      stripe-mode: live
      # Every trigger but the cron runs the full suite. The nightly rebuild
      # ships the same commit and the same data as the push run that already
      # passed — only the date has moved, and it can only move rows from
      # embargoed to published. e2e.yml carries the full reasoning; a push, a
      # PR or a manual dispatch is still gated on Cypress.
      run-e2e: ${{ github.event_name != 'schedule' }}

  # ── Cloudflare Pages: bandincc.it ──────────────────────────────────────────
  # The production deploy, and the only one. Until 2026-09 this ran beside a
  # `package` → `deploy` pair publishing the same artifact to GitHub Pages;
  # those were removed before the repo went private, because on GitHub Free a
  # private repo cannot run a Pages deploy — the job would fail, the run would
  # conclude `failure`, and newsletter.yml (gated on success) would stop
  # sending. See roadmap.md, "Going private on Cloudflare Pages", step 5.
  #
  # Pull requests stop after `test`. Only a push to master, the nightly cron or
  # a manual dispatch is allowed to publish.
  #
  # Direct upload, not Cloudflare's git integration: CI already builds and
  # tests, the repo is private, and uploading the artifact keeps the "what
  # ships is what was tested" guarantee.
  cloudflare:
    name: Deploy to Cloudflare Pages
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
    # No rebuild: this is the exact `out/` the tests just ran against.
    - name: Download tested static export
      uses: actions/download-artifact@v4
      with:
        name: static-export-pages
        path: out

    # Deliberately NOT gated on `vars.CLOUDFLARE_ACCOUNT_ID != ''` any more.
    # That gate made sense while Cloudflare was a second host being stood up
    # beside a working one. It is the only host now: a skipped job would leave
    # the run green, newsletter.yml would mail links to /bandi/ pages that were
    # never deployed, and the daily release would silently stop. Fail instead,
    # naming the cause — the same check staging-deploy.yml makes.
    - name: Check Cloudflare credentials are present
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        missing=0
        [ -n "$CLOUDFLARE_API_TOKEN" ]  || { echo "::error::secrets.CLOUDFLARE_API_TOKEN is empty (scopes: Cloudflare Pages:Edit, Workers KV Storage:Edit)"; missing=1; }
        [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::vars.CLOUDFLARE_ACCOUNT_ID is empty"; missing=1; }
        [ -d out ] && [ -f out/index.html ] || { echo "::error::downloaded artifact has no out/index.html"; missing=1; }
        exit $missing

    # --branch=master makes this a PRODUCTION deployment: Pages treats any other
    # branch name as a preview. The project's production branch must match.
    #
    # The job has no checkout, so wrangler cannot read the commit from git;
    # passing it explicitly labels the deployment in the Pages dashboard.
    - name: Deploy to Cloudflare Pages
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        COMMIT_MESSAGE: ${{ github.workflow }} #${{ github.run_number }} (${{ github.event_name }})
      run: |
        npx wrangler@4 pages deploy out \
          --project-name=bandincc \
          --branch=master \
          --commit-hash="$GITHUB_SHA" \
          --commit-message="$COMMIT_MESSAGE"

  # ── data.json → KV, for the welcome email ──────────────────────────────────
  # stripe-worker/src/welcome.ts builds a new subscriber's table of
  # currently-embargoed bandi from this key. It used to read data/data.json off
  # raw.githubusercontent.com, which only worked while the repo was public.
  #
  # `needs: cloudflare` deliberately: the key must not move ahead of the site. A
  # subscriber who checks out just after a deploy should be shown exactly the
  # rows the live site is still hiding, and writing this first would briefly
  # promise rows the site had not yet released. (It was `needs: deploy`, the
  # GitHub Pages job, until that job was removed — pointing it anywhere that no
  # longer exists would stop the write without an error.)
  #
  # No variable gate of its own: if the credentials are missing, `cloudflare`
  # fails first and this never starts.
  #
  # continue-on-error, because the site being live matters more than the email
  # being current: a failure here leaves the previous value in place, which is
  # stale by at most one deploy, and the run summary still shows it red.
  publish-data:
    name: Publish data.json to KV
    needs: cloudflare
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    # data/ for the payload, the Worker's wrangler.toml so `--binding` resolves
    # to the namespace id without repeating it here.
    - name: Checkout data and the Worker config
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          data
          stripe-worker/wrangler.toml
        sparse-checkout-cone-mode: false

    - name: Write data.json to KV
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        npx wrangler@4 kv key put data.json \
          --path=data/data.json \
          --binding=BANDI \
          --config=stripe-worker/wrangler.toml \
          --remote
