name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  # A bando is subscriber-only for its first seven days, and the cutoff is
  # evaluated at build time (lib/data.ts — `output: 'export'` leaves no server
  # to evaluate it per request). So a rebuild is what actually releases a
  # bando: without this trigger, one detected eight days ago would stay hidden
  # until somebody happened to push.
  #
  # GitHub cron is UTC only: 05:00 UTC is 07:00 in Italy on summer time, 06:00
  # on winter time. It chains into newsletter.yml as usual, which finds no new
  # rows and simply advances the `newsletter-sent` tag.
  schedule:
    - cron: '0 5 * * *'


# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
#
# PR test runs are kept out of the "pages" lane entirely: sharing it would let a
# newly queued PR run evict a queued merge deploy. Superseded PR runs are worth
# cancelling, production deploys are not.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.head_ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Builds the export and runs the Cypress suite against it. Every job below
  # needs this one, so a failing test stops the deploy.
  test:
    name: Build and test
    uses: ./.github/workflows/e2e.yml
    with:
      artifact-name: static-export-pages
      # The real domain, the real money. Stated rather than left to the default
      # so that anyone reading this file sees which Stripe account it ships.
      stripe-mode: live
      # Every trigger but the cron runs the full suite. The nightly rebuild
      # ships the same commit and the same data as the push run that already
      # passed — only the date has moved, and it can only move rows from
      # embargoed to published. e2e.yml carries the full reasoning; a push, a
      # PR or a manual dispatch is still gated on Cypress.
      run-e2e: ${{ github.event_name != 'schedule' }}

  # Pull requests stop after `test`. Only a push to master (or a manual
  # dispatch) is allowed to publish.
  package:
    name: Package for Pages
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
    # No rebuild: this is the exact `out/` the tests just ran against.
    - name: Download tested static export
      uses: actions/download-artifact@v4
      with:
        name: static-export-pages
        path: out

    - name: Add .nojekyll file
      run: touch out/.nojekyll

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./out

  deploy:
    needs: package
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  # ── Cloudflare Pages ───────────────────────────────────────────────────────
  # Runs beside the GitHub Pages jobs above, deploying the SAME tested artifact
  # to a second host, so the migration can be verified on *.pages.dev before any
  # DNS moves. Once bandincc.it points at Cloudflare, `package` and `deploy`
  # above are deleted and this becomes the only deploy — see roadmap.md,
  # "Going private on Cloudflare Pages".
  #
  # Direct upload, not Cloudflare's git integration: CI already builds and
  # tests, the repo is about to be private, and uploading the artifact keeps the
  # "what ships is what was tested" guarantee that `package` has.
  #
  # Gated on the CLOUDFLARE_ACCOUNT_ID *variable* (not a secret — an account id
  # identifies, it does not authorise) so this job simply does not exist until
  # the Pages project does. Setting the variable turns it on; nothing here goes
  # red in the meantime.
  cloudflare:
    name: Deploy to Cloudflare Pages
    needs: test
    if: github.event_name != 'pull_request' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest

    steps:
    - name: Download tested static export
      uses: actions/download-artifact@v4
      with:
        name: static-export-pages
        path: out

    - name: Fail fast if the API token is missing
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      run: |
        if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
          echo "::error::CLOUDFLARE_API_TOKEN is empty. Add it as a repository secret" \
               "(scope: Cloudflare Pages:Edit)."
          exit 1
        fi

    # --branch=master makes this a PRODUCTION deployment: Pages treats any other
    # branch name as a preview. The project's production branch must match.
    - name: Deploy to Cloudflare Pages
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      run: npx wrangler@4 pages deploy out --project-name=bandincc --branch=master

  # ── data.json → KV, for the welcome email ──────────────────────────────────
  # stripe-worker/src/welcome.ts builds a new subscriber's table of
  # currently-embargoed bandi from this key. It used to read data/data.json off
  # raw.githubusercontent.com, which only worked while the repo was public.
  #
  # `needs: deploy` deliberately: the key must not move ahead of the site. A
  # subscriber who checks out just after a deploy should be shown exactly the
  # rows the live site is still hiding, and writing this first would briefly
  # promise rows the site had not yet released.
  #
  # continue-on-error, because the site being live matters more than the email
  # being current: a failure here leaves the previous value in place, which is
  # stale by at most one deploy, and the run summary still shows it red.
  publish-data:
    name: Publish data.json to KV
    needs: deploy
    if: github.event_name != 'pull_request' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    # data/ for the payload, the Worker's wrangler.toml so `--binding` resolves
    # to the namespace id without repeating it here.
    - name: Checkout data and the Worker config
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          data
          stripe-worker/wrangler.toml
        sparse-checkout-cone-mode: false

    - name: Write data.json to KV
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        npx wrangler@4 kv key put data.json \
          --path=data/data.json \
          --binding=BANDI \
          --config=stripe-worker/wrangler.toml \
          --remote
