name: Deploy to GitHub Pages

on:
  push:
    branches: [ master, staging ]
  pull_request:
    branches: [ master, staging ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm ci

    - name: Set base path for staging
      id: set-base
      run: |
        if [ "${{ github.ref }}" == "refs/heads/staging" ]; then
          echo "base=/staging/" >> $GITHUB_OUTPUT
        else
          echo "base=/" >> $GITHUB_OUTPUT
        fi

    - name: Build
      run: npm run build
      env:
        VITE_BASE_PATH: ${{ steps.set-base.outputs.base }}

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4