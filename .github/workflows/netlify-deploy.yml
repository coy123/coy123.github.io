name: Deploy to Netlify

on:
  push:
    branches: [ staging ]
  pull_request:
    branches: [ staging ]
  workflow_dispatch:

# PR test runs get a lane per pull request; pushes to staging share the
# "production" lane. Without the split, a PR run could cancel an in-flight
# deploy, leaving the site un-updated with no visible error.
concurrency:
  group: netlify-staging-${{ github.event_name == 'pull_request' && github.head_ref || 'production' }}
  cancel-in-progress: true

jobs:
  # Builds the export and runs the Cypress suite against it. The deploy job
  # needs this one, so a failing test stops the deploy.
  test:
    name: Build and test
    uses: ./.github/workflows/e2e.yml
    with:
      artifact-name: static-export-netlify

  # Pull requests stop after `test`. Only a push to staging (or a manual
  # dispatch) is allowed to publish.
  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
    # No rebuild: this is the exact `out/` the tests just ran against.
    - name: Download tested static export
      uses: actions/download-artifact@v4
      with:
        name: static-export-netlify
        path: out

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    # Missing secrets used to be invisible: the old netlify/actions/cli action
    # swallowed the CLI's exit code, so an empty token produced a green run and
    # an un-updated site. Fail here instead, with a message that names the cause.
    - name: Check Netlify credentials are present
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      run: |
        missing=0
        [ -n "$NETLIFY_AUTH_TOKEN" ] || { echo "::error::secrets.NETLIFY_AUTH_TOKEN is empty"; missing=1; }
        [ -n "$NETLIFY_SITE_ID" ]    || { echo "::error::secrets.NETLIFY_SITE_ID is empty"; missing=1; }
        [ -d out ] && [ -f out/index.html ] || { echo "::error::downloaded artifact has no out/index.html"; missing=1; }
        exit $missing

    # Run the CLI directly rather than through netlify/actions/cli@master: that
    # action pipes `netlify` through a command substitution and then ends on an
    # `::set-output` echo (a workflow command GitHub removed in 2023), so the
    # step exited 0 whatever the CLI did and printed none of its output.
    # A plain `run:` propagates the exit code and shows the deploy log.
    #
    # `--no-build` is required, not cosmetic: since netlify-cli v20 building is
    # the DEFAULT for `deploy`. Without it the CLI pulls the site's build
    # settings from the Netlify UI and runs `npm run build` here — in a job with
    # no checkout and therefore no package.json. We deploy the tested `out/`
    # from the artifact and must never rebuild it.
    - name: Deploy to Netlify
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      run: |
        npx --yes netlify-cli@27 deploy \
          --dir=out \
          --prod \
          --no-build \
          --message "${{ github.sha }} — ${{ github.workflow }} #${{ github.run_number }}"
