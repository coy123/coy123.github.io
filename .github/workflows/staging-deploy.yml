name: Deploy staging to Cloudflare Pages

on:
  push:
    branches: [ staging ]
  pull_request:
    branches: [ staging ]
  workflow_dispatch:

# PR test runs get a lane per pull request; pushes to staging share the
# "production" lane. Without the split, a PR run could cancel an in-flight
# deploy, leaving the site un-updated with no visible error.
#
# The prefix must not be `pages-`: concurrency groups are repo-wide, and that
# one belongs to deploy.yml's production lane.
concurrency:
  group: staging-${{ github.event_name == 'pull_request' && github.head_ref || 'production' }}
  cancel-in-progress: true

jobs:
  # Builds the export and runs the Cypress suite against it. The deploy job
  # needs this one, so a failing test stops the deploy.
  test:
    name: Build and test
    uses: ./.github/workflows/e2e.yml
    with:
      artifact-name: static-export-staging
      # Staging exercises the full funnel — page → Payment Link → checkout →
      # /grazie/ → Worker → MailerLite — against Stripe's test account and a
      # throwaway MailerLite group, so no real card is ever charged and no real
      # subscriber is ever touched. See lib/subscription.ts.
      stripe-mode: test

  # Pull requests stop after `test`. Only a push to staging (or a manual
  # dispatch) is allowed to publish.
  #
  # Staging is a PREVIEW deployment of the same `bandincc` Pages project that
  # deploy.yml publishes production to. Pages decides production vs preview by
  # branch name alone: the project's production branch is `master`, so
  # `--branch=staging` can never touch bandincc.it. Every staging deploy is
  # reachable at the stable branch alias https://staging.bandincc.pages.dev
  # (plus a per-deployment <hash>.bandincc.pages.dev URL), and Pages sends
  # `X-Robots-Tag: noindex` on every preview deployment by default.
  #
  # Until 2026-09-10 this was netlify-deploy.yml, publishing to a Netlify site.
  # That site still serves its last deploy until it is deleted — see roadmap.md,
  # "Going private on Cloudflare Pages", step 6.
  deploy:
    name: Deploy to Cloudflare Pages (preview)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
    # No rebuild: this is the exact `out/` the tests just ran against.
    - name: Download tested static export
      uses: actions/download-artifact@v4
      with:
        name: static-export-staging
        path: out

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    # Deliberately NOT gated on `vars.CLOUDFLARE_ACCOUNT_ID != ''` the way
    # deploy.yml's `cloudflare` job is. There, Cloudflare was a second host being
    # stood up beside a working one, so a missing variable had to be a no-op.
    # Here it is the only host: a skipped job would look like success while
    # staging silently stopped updating — exactly the failure the old Netlify
    # action produced for months. Fail instead, naming the cause.
    - name: Check Cloudflare credentials are present
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        missing=0
        [ -n "$CLOUDFLARE_API_TOKEN" ]  || { echo "::error::secrets.CLOUDFLARE_API_TOKEN is empty (scope: Cloudflare Pages:Edit)"; missing=1; }
        [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::vars.CLOUDFLARE_ACCOUNT_ID is empty"; missing=1; }
        [ -d out ] && [ -f out/index.html ] || { echo "::error::downloaded artifact has no out/index.html"; missing=1; }
        exit $missing

    # The job has no checkout, so wrangler cannot read the commit from git;
    # passing it explicitly labels the deployment in the Pages dashboard, the
    # way `netlify deploy --message` used to.
    - name: Deploy to Cloudflare Pages
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        COMMIT_MESSAGE: ${{ github.workflow }} #${{ github.run_number }}
      run: |
        npx wrangler@4 pages deploy out \
          --project-name=bandincc \
          --branch=staging \
          --commit-hash="$GITHUB_SHA" \
          --commit-message="$COMMIT_MESSAGE"

    - name: Link staging in the run summary
      run: |
        {
          echo "### Staging deployed"
          echo
          echo "<https://staging.bandincc.pages.dev/> — Stripe test mode, \`noindex\`."
        } >> "$GITHUB_STEP_SUMMARY"

  # Writes the bandi still inside their seven-day window into the run summary,
  # each linking to the detail page that is now live on staging. Those pages are
  # built from day 0 (app/bandi/[bid]/page.tsx builds every row) but unlinked,
  # kept out of the sitemap and marked `noindex`, so without this list there is
  # no way to reach one without working the slug out by hand.
  #
  # Staging only, deliberately. `deploy.yml` gets no equivalent: production is
  # where these rows are *released*, so a list of them there is noise.
  #
  # THE RUN SUMMARY IS PUBLIC while the repo is, and this prints embargoed
  # comune names into it. That leaks nothing new today — data/data.json is
  # world-readable in the repo itself — but it is a choice, not an oversight.
  #
  # The repo is going private (roadmap.md), which resolves this rather than
  # breaking it: a private repo's run summaries are visible only to
  # collaborators. The Worker's copy of the same dependency has already moved to
  # KV; this step needs nothing.
  #
  # A separate job rather than a step on `deploy`, because `deploy` has no
  # checkout and must keep it: what ships is the tested artifact and nothing
  # else. This job gets its own sparse checkout instead.
  preview-urls:
    name: List embargoed preview URLs
    needs: deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Purely informational, and it runs after the site is already live. A crash
    # here must never turn a successful staging deploy red.
    continue-on-error: true

    steps:
    # Only what the script imports: it reads data/, and pulls the real
    # `isPublished`/`toSlug`/`trimStrings` out of lib/ rather than copying them.
    - name: Checkout data and helpers
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          scripts
          data
          lib
          .nvmrc
          package.json
        sparse-checkout-cone-mode: false

    # `node-version-file` resolves to the newest 22.x, which matters here:
    # scripts/preview-embargoed.mjs imports lib/*.ts directly and relies on the
    # type stripping Node has had unflagged since 22.18.
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    # Never fails: on any error it still writes a summary saying so, rather than
    # leaving a blank panel that looks like "no bandi held back".
    - name: Write preview URLs to the run summary
      run: |
        if node scripts/preview-embargoed.mjs --markdown > preview.md 2>preview.err; then
          cat preview.md >> "$GITHUB_STEP_SUMMARY"
        else
          {
            echo "### Bandi preview unavailable"
            echo
            echo 'The staging deploy succeeded; only this listing failed.'
            echo
            echo '```'
            cat preview.err
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi
