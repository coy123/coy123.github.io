name: Build and E2E tests

# Reusable deploy gate. Builds the static export, runs the Cypress suite
# against the real `out/` artifact, then publishes that exact artifact for the
# calling workflow to deploy — so what ships is what was tested.
#
# Self-contained by design: the opt-in specs that hit the real internet
# (`external-resources.cy.ts` and the "reaches every external target" tests in
# `links.cy.ts`) stay off, because `checkExternalLinks` defaults to false in
# `cypress.config.ts` and nothing here sets `CYPRESS_checkExternalLinks`.
# Wikimedia crests, OSM tiles and Umami are stubbed by `stubExternalAssets`.
# A municipal site going down can therefore never block a deploy.

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Name of the uploaded static export, consumed by the caller.
        type: string
        default: static-export
      stripe-mode:
        description: >-
          Which Stripe account the export is built against: `live` (production,
          GitHub Pages) or `test` (staging, Netlify). Defaults to `live`, and
          that direction is deliberate — a caller that forgets to pass `test`
          ships the placeholder state to staging, which is visible and harmless,
          whereas the reverse would put a test-mode checkout on the real domain.
        type: string
        default: live

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Electron's runtime libraries. Documented in cypress/README.md — the
      # `t64` suffixes are correct for the Ubuntu 24.04 runner image.
      - name: Install Cypress system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk2.0-0t64 libgbm1 libnotify4 libnss3 libxss1 libasound2t64 xvfb

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: cypress-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # No-op when the cache above hit; downloads the binary when it did not.
      - name: Install Cypress binary
        run: npx cypress install

      - name: Verify Cypress
        run: npx cypress verify

      # The browser-less half of the suite: the release rule, every check on
      # data/*.json, and the Stripe links in locales/it.json. None of it needs a
      # build or a server, so it runs first — a bad deadline, a pasted crest or
      # a test-mode Payment Link on a live build is named in about two seconds
      # rather than after a Next build and a five-minute Electron run. Node 22
      # strips the TypeScript itself; there is no test framework and no extra
      # dependency behind this step.
      #
      # STRIPE_MODE is here for the same reason it is on the two steps below:
      # `test/subscription.test.ts` checks that the URLs in the JSON belong to
      # the mode this job is about to build.
      - name: Run unit tests
        run: npm run test:unit
        env:
          STRIPE_MODE: ${{ inputs.stripe-mode }}

      # The Worker is a separate package with its own tsconfig, and the root
      # `tsconfig.json` excludes `stripe-worker` — so nothing here typechecked it
      # until this step existed. It matters more than a typecheck usually does:
      # `sendWelcomeEmail` swallows every error by design (a throw would 500 the
      # webhook and make Stripe retry, re-granting and re-sending), so a break in
      # that file costs a paying subscriber their welcome email silently, with
      # one Worker log line as the only trace.
      #
      # `npm ci` because the Worker carries its own lockfile. It is not part of
      # the root install, and it holds no test suite of its own — this is the
      # whole of its CI.
      - name: Typecheck the Stripe Worker
        run: |
          npm ci --prefix stripe-worker
          npm --prefix stripe-worker run typecheck

      - name: Build static export
        run: npm run build
        env:
          NODE_ENV: production
          STRIPE_MODE: ${{ inputs.stripe-mode }}

      # Serves `out/` on :3000 and runs the suite in static-export mode.
      # A failure here fails the job, and every deploy job needs this one.
      #
      # STRIPE_MODE is repeated here on purpose: `subscription.cy.ts` resolves
      # the Stripe URLs for this mode and then looks for those exact hrefs in
      # the DOM, so if the two steps ever disagreed the anchors would not be
      # found and the suite would go red rather than ship a mismatched export.
      - name: Run E2E tests against the static export
        run: npm run test:e2e:static
        env:
          STRIPE_MODE: ${{ inputs.stripe-mode }}

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: out
          include-hidden-files: true
          retention-days: 1
