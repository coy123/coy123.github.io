[build]
  command = "npm run build:prerender"
  publish = "dist"

# Prerendering: Serve static HTML to bots and crawlers
# Regular users get the SPA experience
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
  # This allows the prerendered HTML files to be served first
  conditions = {Role = ["user"]}

[build.environment]
  NODE_VERSION = "18"

# Enable compression
[[headers]]
  for = "/*"
  [headers.values]
    # Enable Gzip and Brotli compression
    Content-Encoding = "gzip, br"
    # Security headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache fonts
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache HTML with shorter time
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Cache JSON data
[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

